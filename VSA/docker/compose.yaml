# Explicit project name: both compose files live in a folder called "docker",
# which would otherwise put them into the same Compose project
name: iotflow-vsa
services:
  vsa_docker:
    build:
      context: .
    command: ["sh", "./run.sh"]
    # Optional overrides, taken from the host environment if set (see execute_vsa.sh)
    environment: [ANALYSES, VSA_XMX, VSA_EXCLUDE, D2J_XMX]
    # The analysis logs millions of lines per hour; cap Docker's log files
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "3"
    volumes:
      - apps_to_analyze_vsa:/apps_to_analyze/
      - results_vsa:/results/
volumes:
  apps_to_analyze_vsa:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './apps_to_analyze/'
  results_vsa:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './results/'